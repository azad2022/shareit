name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK platform
        run: |
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Validate Gradle wrapper and build
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests, lint, and debug APK build
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            :core:domain:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:storage:testDebugUnitTest \
            :app:lintDebug \
            :core:data:lintDebug \
            :core:designsystem:lintDebug \
            :core:domain:lintDebug \
            :core:connectivity:lintDebug \
            :core:storage:lintDebug \
            :core:transfer:testDebugUnitTest \
            :core:transfer:lintDebug \
            :app:assembleDebug

      - name: Compute debug APK SHA-256
        if: success()
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  secure-tls-instrumented:
    name: Android storage publication and mTLS (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Validate Gradle wrapper and build
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android storage publication and mTLS tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :core:data:connectedDebugAndroidTest :core:storage:connectedDebugAndroidTest :core:connectivity:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-storage-and-mtls-instrumented-api-${{ matrix.api-level }}
          path: |
            core/data/build/outputs/androidTest-results/**
            core/data/build/reports/androidTests/**
            core/data/schemas/**
            core/storage/build/outputs/androidTest-results/**
            core/storage/build/reports/androidTests/**
            core/connectivity/build/outputs/androidTest-results/**
            core/connectivity/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
