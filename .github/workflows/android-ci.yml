name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK platform
        run: |
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Validate Gradle wrapper and build
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests, lint, and debug APK build
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            :core:domain:testDebugUnitTest \
            :app:lintDebug \
            :core:data:lintDebug \
            :core:designsystem:lintDebug \
            :core:domain:lintDebug \
            :core:connectivity:lintDebug \
            :core:storage:lintDebug \
            :app:assembleDebug

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
