name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK platform
        run: |
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Validate Gradle wrapper and build
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests, lint, and debug APK build
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            :core:domain:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:storage:testDebugUnitTest \
            :app:lintDebug \
            :core:data:lintDebug \
            :core:designsystem:lintDebug \
            :core:domain:lintDebug \
            :core:connectivity:lintDebug \
            :core:storage:lintDebug \
            :core:transfer:testDebugUnitTest \
            :core:transfer:lintDebug \
            :core:calling:testDebugUnitTest \
            :core:calling:lintDebug \
            :app:assembleDebug

      - name: Prepare ABI APKs and compute SHA-256
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/debug"
          find_apk() {
            local pattern="$1"
            find "$output_dir" -maxdepth 1 -type f -iname "$pattern" ! -name 'peyvand-*' -print -quit
          }
          universal_apk="$(find_apk '*universal*debug.apk')"
          arm64_apk="$(find_apk '*arm64-v8a*debug.apk')"
          armv7_apk="$(find_apk '*armeabi-v7a*debug.apk')"
          x86_apk="$(find_apk '*x86-debug.apk')"
          x86_64_apk="$(find_apk '*x86_64-debug.apk')"
          test -n "$universal_apk"
          test -n "$arm64_apk"
          test -n "$armv7_apk"
          test -n "$x86_apk"
          test -n "$x86_64_apk"
          cp "$universal_apk" "$output_dir/peyvand-universal-debug.apk"
          cp "$arm64_apk" "$output_dir/peyvand-arm64-v8a-debug.apk"
          cp "$armv7_apk" "$output_dir/peyvand-armeabi-v7a-debug.apk"
          sha256sum "$output_dir/peyvand-universal-debug.apk" > "$output_dir/peyvand-universal-debug.apk.sha256"
          sha256sum "$output_dir/peyvand-arm64-v8a-debug.apk" > "$output_dir/peyvand-arm64-v8a-debug.apk.sha256"
          sha256sum "$output_dir/peyvand-armeabi-v7a-debug.apk" > "$output_dir/peyvand-armeabi-v7a-debug.apk.sha256"
          {
            echo "| Debug APK variant | Bytes | SHA-256 |"
            echo "|---|---:|---|"
            for apk in "$output_dir"/peyvand-*-debug.apk; do
              bytes="$(stat -c '%s' "$apk")"
              digest="$(sha256sum "$apk" | cut -d ' ' -f 1)"
              echo "| $(basename "$apk") | $bytes | `$digest` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload universal debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-debug-apk
          path: |
            app/build/outputs/apk/debug/peyvand-universal-debug.apk
            app/build/outputs/apk/debug/peyvand-universal-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload arm64-v8a debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-debug-apk-arm64-v8a
          path: |
            app/build/outputs/apk/debug/peyvand-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/peyvand-arm64-v8a-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload armeabi-v7a debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-debug-apk-armeabi-v7a
          path: |
            app/build/outputs/apk/debug/peyvand-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/peyvand-armeabi-v7a-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  secure-tls-instrumented:
    name: Android storage publication and mTLS (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Validate Gradle wrapper and build
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android storage publication and mTLS tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace --continue :core:data:connectedDebugAndroidTest :core:storage:connectedDebugAndroidTest :core:connectivity:connectedDebugAndroidTest

      - name: Upload Room instrumentation APK for physical-device validation
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: peyvand-room-instrumentation-apk-api-${{ matrix.api-level }}
          path: |
            core/data/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-storage-and-mtls-instrumented-api-${{ matrix.api-level }}
          path: |
            core/data/build/outputs/androidTest-results/**
            core/data/build/reports/androidTests/**
            core/data/schemas/**
            core/storage/build/outputs/androidTest-results/**
            core/storage/build/reports/androidTests/**
            core/connectivity/build/outputs/androidTest-results/**
            core/connectivity/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
